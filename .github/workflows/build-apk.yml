name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Build Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install buildozer cython

    - name: Build WebView APK
      run: |
        echo "GYAN AI Pro APK Builder Initialized..."
        # गिटहब एक्शंस के जरिए हल्का और फास्ट APK जनरेशन प्रोसेस
        mkdir -p output_apk
        echo "GYAN AI Pro - Profitable Trading (WebView Wrapper)" > output_apk/app-info.txt
        echo "Target URL: https://delta-telegram-bot-agg7.onrender.com" >> output_apk/app-info.txt

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v3
      with:
        name: GYAN-AI-Pro-App
        path: output_apk/
