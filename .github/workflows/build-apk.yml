name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Build WebView Wrapper App
      run: |
        echo "Building GYAN AI Pro APK..."
        
        # Create a basic Android project structure
        mkdir -p my-app/app/src/main/java/com/gyanai/pro
        mkdir -p my-app/app/src/main/res/layout
        mkdir -p my-app/app/src/main/res/values

        # AndroidManifest.xml
        cat << 'EOF' > my-app/app/src/main/AndroidManifest.xml
        <manifest xmlns:android="http://schemas.android.com/apk/res/android"
            package="com.gyanai.pro">
            <uses-permission android:name="android.permission.INTERNET" />
            <application
                android:allowBackup="true"
                android:icon="@mipmap/ic_launcher"
                android:label="GYAN AI Pro"
                android:roundIcon="@mipmap/ic_launcher_round"
                android:supportsRtl="true"
                android:theme="@android:style/Theme.NoTitleBar.Fullscreen">
                <activity
                    android:name=".MainActivity"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

        # MainActivity.java
        cat << 'EOF' > my-app/app/src/main/java/com/gyanai/pro/MainActivity.java
        package com.gyanai.pro;
        import android.app.Activity;
        import android.os.Bundle;
        import android.webkit.WebView;
        import android.webkit.WebViewClient;
        import android.webkit.WebSettings;

        public class MainActivity extends Activity {
            WebView wv;
            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                wv = new WebView(this);
                WebSettings webSettings = wv.getSettings();
                webSettings.setJavaScriptEnabled(true);
                webSettings.setDomStorageEnabled(true);
                webSettings.setLoadsImagesAutomatically(true);
                wv.setWebViewClient(new WebViewClient());
                wv.loadUrl("https://delta-telegram-bot-agg7.onrender.com");
                setContentView(wv);
            }
            @Override
            public void onBackPressed() {
                if (wv != null && wv.canGoBack()) {
                    wv.goBack();
                } else {
                    super.onBackPressed();
                }
            }
        }
        EOF

        # build.gradle (app level)
        cat << 'EOF' > my-app/app/build.gradle
        plugins {
            id 'com.android.application'
        }
        android {
            namespace 'com.gyanai.pro'
            compileSdk 33
            defaultConfig {
                applicationId "com.gyanai.pro"
                minSdk 21
                targetSdk 33
                versionCode 1
                versionName "1.0"
            }
            buildTypes {
                release {
                    minifyEnabled false
                }
            }
        }
        dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
        }
        EOF

        # build.gradle (project level)
        cat << 'EOF' > my-app/build.gradle
        plugins {
            id 'com.android.application' version '8.1.1' apply false
        }
        EOF

        # settings.gradle
        cat << 'EOF' > my-app/settings.gradle
        rootProject.name = "GYAN AI Pro"
        include ':app'
        EOF

        # local.properties
        echo "sdk.dir=$ANDROID_HOME" > my-app/local.properties

        # Build APK using Gradle
        cd my-app
        chmod +x gradlew || true
        gradle wrapper
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v3
      with:
        name: GYAN-AI-Pro-APK
        path: my-app/app/build/outputs/apk/debug/app-debug.apk
